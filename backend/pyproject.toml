[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "research-os-backend"
version = "0.1.0"
description = "FastAPI backend foundation for Research OS."
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13",
  "fastapi>=0.115",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "pypdf>=5.0",
  "python-multipart>=0.0.9",
  "sqlalchemy>=2.0",
  "uvicorn[standard]>=0.30",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27",
  "pytest>=8.2",
  "ruff>=0.5",
]

[tool.setuptools.packages.find]
include = [
  "api*",
  "core*",
  "database*",
  "models*",
  "repositories*",
  "schemas*",
  "services*",
  "utils*",
  "workers*",
]

[tool.setuptools]
py-modules = ["main"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["."]
