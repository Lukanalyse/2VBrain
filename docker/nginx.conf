server {
    listen 80;
    server_name _;

    # Resolve upstream service names at request time via Docker's embedded DNS
    # (127.0.0.11) instead of once at startup. This is what makes the stack
    # reboot-proof: nginx starts even when backend/frontend are not up yet, and
    # it picks up their new IP whenever a container is recreated (no stale 502).
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/v1/ {
        set $backend_upstream backend:8000;
        proxy_pass http://$backend_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        set $frontend_upstream frontend:5173;
        proxy_pass http://$frontend_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
